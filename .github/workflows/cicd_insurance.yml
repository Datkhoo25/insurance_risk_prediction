name: Python CI1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Install Git LFS
      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      # Step 3: Set up Docker Buildx (for build multi-platform images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t my-flask-app .

      # Step 5: Run Docker container (Flask app)
      - name: Run Docker container (Flask app)
        run: |
          docker run -d -p 5000:5000 --name flask-app my-flask-app

      # Step 6: Run tests (inside the running container)
      - name: Run tests (inside the running container)
        run: |
          docker exec flask-app pytest  # Execute pytest inside the running container

      # Step 7: Stop and remove the container after tests
      - name: Stop Docker container
        run: |
          docker stop flask-app
          docker rm flask-app
